<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Gauntlet — 3 puzzles, one clock</title>
  <meta name="description" content="A daily gauntlet of quick puzzle games — Shikaku, Minesweeper, and a 1-to-100 numbers rush — played back to back on one clock. Same run for everyone, every day.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%23e19b3c'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle'%3E%E2%9B%93%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>⛓️ The <span class="accent">Gauntlet</span></h1>
    <div id="runStatus" class="run-status" hidden>
      <span id="stageLabel"></span>
      <span class="dot">·</span>
      <span id="runTimer" class="run-timer">0:00</span>
      <button id="restartBtn" class="btn subtle small">Restart</button>
    </div>
  </header>

  <main>
    <div id="screen"></div>
  </main>

  <footer>
    <a href="https://github.com/astroleaf15/gauntlet" target="_blank" rel="noopener">Source on GitHub</a>
    <span class="dot">·</span>
    <a href="https://astroleaf15.github.io/shikaku/">Solo Shikaku ➜</a>
    <span class="dot">·</span>
    <span>New run every day at midnight</span>
  </footer>

  <script src="core.js"></script>
  <script src="shikaku-core.js"></script>
  <script src="games/shikaku.js"></script>
  <script src="games/minesweeper.js"></script>
  <script src="games/numbers.js"></script>
  <script src="gauntlet.js"></script>
</body>
</html>
